[project]
name = "orchestra-mcp"
version = "0.1.0"
description = "Local MCP server for managing Orchestra task/worker/run state and Git worktrees."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
tui = ["textual>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestra_mcp*"]
