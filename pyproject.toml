[project]
name = "symphonai"
version = "0.1.0"
description = "A customizable coding-agent runtime and terminal UI."
requires-python = ">=3.11"
# The runtime is standard-library only. Textual is the sole dependency and it
# is optional, so `symphonai_api` imports and runs anywhere Python does.
dependencies = []

[project.scripts]
symphonai = "symphonai_host.headless:main"

[project.optional-dependencies]
tui = ["textual>=8,<9"]
build = ["pyinstaller>=6,<7"]
bench = ["harbor==0.25.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["symphonai_api*", "symphonai_tui*", "symphonai_host*", "symphonai_app*"]

[tool.setuptools.package-data]
"symphonai_api.data" = ["*.json", "skills/*.md"]
symphonai_app = ["index.html", "app.css", "keys.default.json", "src/**/*"]
