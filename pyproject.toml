[project]
name = "symphonai"
version = "0.1.0"
description = "A customizable coding-agent runtime and terminal UI."
requires-python = ">=3.10"
# The runtime is standard-library only. Textual is the sole dependency and it
# is optional, so `symphonai_api` imports and runs anywhere Python does.
dependencies = []

[project.optional-dependencies]
tui = ["textual>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["symphonai_api*", "symphonai_tui*", "symphonai_host*"]

[tool.setuptools.package-data]
"symphonai_api.data" = ["*.json"]
