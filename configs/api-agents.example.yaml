# Example Orchestra API agent configuration (orchestra_api).
#
# This file is documentation/config only -- nothing in orchestra_api loads
# or parses it yet. It shows the shape a future config loader would read.
#
# API KEYS MUST NEVER BE PLACED IN THIS FILE, or in any config file. Every
# provider below reads its key only from the environment variable named
# here, at call time -- never from a config value. See
# docs/orchestra-api-runtime.md.
#
# Only `fake-default` is usable today, via
# orchestra_api.providers.fake.FakeModelProvider. The openai/anthropic/
# gemini/qwen entries are interface-conforming placeholders: their
# create_response() raises NotImplementedError. Real HTTP request/response
# handling for them is a later task.

agents:
  - name: fake-default
    provider: fake
    description: >-
      Deterministic, scripted-response provider for local development and
      tests. No network calls, no API key needed.

  - name: openai-default
    provider: openai              # placeholder only -- see docs/orchestra-api-runtime.md
    description: >-
      Placeholder profile for the OpenAI API. create_response() is not
      implemented yet.
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key_env_var: OPENAI_API_KEY   # name only; the key itself lives in your shell/secret store

  - name: anthropic-default
    provider: anthropic           # placeholder only -- see docs/orchestra-api-runtime.md
    description: >-
      Placeholder profile for the Anthropic Claude API. create_response()
      is not implemented yet.
    model: claude-sonnet-4-5
    base_url: https://api.anthropic.com/v1
    api_key_env_var: ANTHROPIC_API_KEY   # name only; the key itself lives in your shell/secret store

  - name: gemini-default
    provider: gemini               # placeholder only -- see docs/orchestra-api-runtime.md
    description: >-
      Placeholder profile for the Gemini API. create_response() is not
      implemented yet.
    model: gemini-2.0-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env_var: GEMINI_API_KEY   # name only; the key itself lives in your shell/secret store

  - name: qwen-default
    provider: openai_compatible    # placeholder only -- see docs/orchestra-api-runtime.md
    description: >-
      Placeholder profile for a Qwen (or other OpenAI-compatible) endpoint.
      create_response() is not implemented yet. base_url and
      api_key_env_var are caller-supplied since this covers many different
      hosted/self-hosted endpoints, not just one vendor.
    model: qwen-placeholder
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env_var: QWEN_API_KEY   # name only; the key itself lives in your shell/secret store
