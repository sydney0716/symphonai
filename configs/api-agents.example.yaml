# Example Orchestra API agent configuration (orchestra_api).
#
# This file is documentation/config only -- nothing in orchestra_api loads
# or parses it yet. It shows the shape a future config loader would read.
#
# API KEYS MUST NEVER BE PLACED IN THIS FILE, or in any config file. Every
# provider below reads its key only from the environment variable named
# here, at call time -- never from a config value. See
# docs/orchestra-api-runtime.md.
#
# All profiles below are usable: there are three real wire formats --
# Anthropic messages, OpenAI chat-completions, and Gemini generateContent
# -- and every other vendor here speaks the OpenAI-compatible one, so it
# is configuration rather than new provider code.
#
# Catalog-backed profiles (grok/kimi/qwen/...) use UNVERIFIED presets from
# orchestra_api/provider_catalog.py: base URLs and model names were not
# probed against a live account and vendors change both. Check the
# vendor's current docs before relying on one. Note also that
# "OpenAI-compatible" is a de facto standard -- tool-calling support in
# particular varies, so an endpoint can connect and still never invoke a
# tool.

agents:
  - name: fake-default
    provider: fake
    description: >-
      Deterministic, scripted-response provider for local development and
      tests. No network calls, no API key needed.

  - name: openai-default
    provider: openai
    description: >-
      Real OpenAI Chat Completions provider. model is set to a cheap tier
      deliberately -- verify it still matches your account's pricing/
      allowance before relying on it.
    model: gpt-5.4-mini
    base_url: https://api.openai.com/v1
    api_key_env_var: OPENAI_API_KEY   # name only; the key itself lives in your shell/secret store

  - name: anthropic-default
    provider: anthropic
    description: >-
      Real Anthropic Messages provider. model is set to the cheap Haiku
      tier deliberately for low-cost testing.
    model: claude-haiku-4-5-20251001
    base_url: https://api.anthropic.com/v1
    api_key_env_var: ANTHROPIC_API_KEY   # name only; the key itself lives in your shell/secret store

  - name: gemini-default
    provider: gemini
    description: >-
      Real Gemini provider. Gemini is the one vendor here with its own
      wire format (contents/parts, functionCall/functionResponse) AND a
      restricted JSON Schema dialect, so its tool schemas are rewritten by
      orchestra_api/gemini_schema.py before being sent.
    # Pinned on purpose: the provider's own default is the rolling
    # `gemini-flash-lite-latest` alias, but a config file is where you want an
    # explicit, reproducible version. Verify it is still served before relying
    # on it -- Google retires models, and a retired one fails with HTTP 404.
    model: gemini-3.7-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env_var: GEMINI_API_KEY   # name only; sent as the x-goog-api-key header, never in the URL

  # --- OpenAI-compatible endpoints, from orchestra_api/provider_catalog.py ---
  # These are all the same OpenAICompatibleProvider with different config.
  # Catalog keys available: grok, kimi, deepseek, qwen, ollama, openrouter,
  # groq, together. All presets are UNVERIFIED -- check vendor docs.

  - name: qwen-default
    provider: openai_compatible
    catalog_key: qwen
    description: >-
      Alibaba Qwen via DashScope's OpenAI-compatible mode. base_url and
      api_key_env_var are caller-supplied since this provider covers many
      different hosted/self-hosted endpoints, not just one vendor.
    model: qwen-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env_var: DASHSCOPE_API_KEY   # name only; the key itself lives in your shell/secret store

  - name: grok-default
    provider: openai_compatible
    catalog_key: grok
    description: xAI Grok via its OpenAI-compatible surface. Unverified preset.
    model: grok-4
    base_url: https://api.x.ai/v1
    api_key_env_var: XAI_API_KEY   # name only; the key itself lives in your shell/secret store

  - name: kimi-default
    provider: openai_compatible
    catalog_key: kimi
    description: >-
      Moonshot Kimi. Unverified preset -- there is also an international
      endpoint, so check which one your key is issued for.
    model: moonshot-v1-8k
    base_url: https://api.moonshot.cn/v1
    api_key_env_var: MOONSHOT_API_KEY   # name only; the key itself lives in your shell/secret store

# Leader/subagent selection for orchestra_api.leader.Leader.
#
# This is always a user choice, referencing profile names from `agents:`
# above -- never something a model decides at runtime. One shared
# subagent provider for now (every subagent in a run uses the same
# profile); a per-role roster is explicitly deferred, not built here.
#
# Not loaded by any script yet -- this block shows the intended shape for
# a future config loader, same as the rest of this file.
leader: anthropic-default
subagent: openai-default
