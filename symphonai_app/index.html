<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SymphonAI</title>
    <script>
      try {
        const theme = localStorage.getItem("symphonai.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="app.css">
    <!-- symphonai-handshake -->
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <nav id="sidebar" aria-label="Pages">
        <h1 id="home-link">SymphonAI</h1>
        <button id="new-chat" class="new-chat icon-plus" type="button">New chat</button>
        <div id="page-links"></div>
      </nav>
      <button id="sidebar-toggle" class="sidebar-toggle icon-left-panel" type="button">Hide sidebar</button>
      <div id="page">
        <main id="chat-pane" class="chat-pane" aria-label="Chat pane">
          <p id="run-notice" class="run-notice" aria-live="polite"></p>
          <div id="chat" class="chat-log" aria-live="polite"></div>
          <div id="approvals" class="approvals" aria-live="polite"></div>
          <button id="jump-latest" class="jump-latest" type="button" hidden>Jump to latest</button>
          <form id="prompt-form" class="prompt-form">
            <textarea id="prompt" rows="3" aria-label="Message" placeholder="Describe a task, or type / for commands"></textarea>
            <div id="prompt-attachments" class="prompt-attachments"></div>
            <p id="prompt-error" class="prompt-error" aria-live="polite"></p>
          </form>
        </main>
      </div>
      <aside id="status-rail" aria-label="Status">
        <div id="rail-tabs" class="rail-tabs" role="tablist" aria-label="Open tools"></div>
        <div id="agents" class="rail-pane" role="tabpanel"></div>
        <div id="roadmap" class="rail-pane" role="tabpanel" hidden></div>
        <div id="changes" class="rail-pane changes-pane" role="tabpanel" hidden></div>
        <article id="spec" class="rail-pane spec-view" role="tabpanel" aria-live="polite" hidden></article>
        <div id="files" class="rail-pane files-pane" role="tabpanel" hidden></div>
        <div id="rail-tools" class="rail-tools" aria-label="Tools" hidden></div>
      </aside>
      <button id="rail-toggle" class="rail-toggle icon-right-panel" type="button">Hide status</button>
    </div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
