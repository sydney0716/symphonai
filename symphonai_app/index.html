<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SymphonAI</title>
    <link rel="stylesheet" href="app.css">
    <!-- symphonai-handshake -->
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <nav id="sidebar" aria-label="Pages">
        <h1 id="home-link">SymphonAI</h1>
        <button id="new-chat" class="new-chat" type="button">New chat</button>
        <div id="page-links"></div>
      </nav>
      <button id="sidebar-toggle" class="sidebar-toggle" type="button">Hide sidebar</button>
      <div id="page">
        <main id="chat-pane" class="chat-pane" aria-label="Chat pane">
          <p id="run-notice" class="run-notice" aria-live="polite"></p>
          <div id="chat" class="chat-log" aria-live="polite"></div>
          <div id="approvals" class="approvals" aria-live="polite"></div>
          <form id="prompt-form" class="prompt-form">
            <textarea id="prompt" rows="3" required aria-label="Message"></textarea>
            <p id="prompt-error" class="prompt-error" aria-live="polite"></p>
            <button type="submit">Send</button>
          </form>
        </main>
      </div>
      <aside id="status-rail" aria-label="Status">
        <div id="agents"></div>
        <div id="roadmap"></div>
        <article id="spec" class="spec-view" aria-live="polite"></article>
      </aside>
      <button id="rail-toggle" class="rail-toggle" type="button">Hide status</button>
    </div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
